name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-upstream:
    name: Build ModernUI-Code Unofficial
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ModernUI-Code Unofficial
        uses: actions/checkout@v4
        with:
          repository: king146464646/ModernUI-Code
          ref: 3.13.0
          path: ModernUI-Code

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ModernUI-Code Unofficial
        working-directory: ModernUI-Code
        # Only core is needed; copyDependencies dumps its runtime classpath
        # (arc3d, slf4j, icu4j, fastutil, ...) next to the jar, because the
        # flat fileTree in common/build.gradle does not resolve transitively.
        run: |
          chmod +x ./gradlew
          ./gradlew :modernui-core:jar :modernui-core:copyDependencies --console=plain

      - name: Collect ModernUI-Code jars
        shell: bash
        run: |
          mkdir -p dist
          cp ModernUI-Code/core/build/libs/*.jar dist/
          cp ModernUI-Code/core/build/output/libs/*.jar dist/
          # sources/javadoc jars must not end up on the compile classpath
          rm -f dist/*-sources.jar dist/*-javadoc.jar
          ls -l dist

      # Hand the upstream jars to the matrix jobs via cache (not an artifact,
      # so nothing shows up in the downloadable Artifacts list).
      - name: Cache ModernUI-Code libs
        uses: actions/cache/save@v4
        with:
          path: dist
          key: modernui-code-${{ github.run_id }}-${{ github.run_attempt }}

  build:
    name: Build ${{ matrix.name }}
    needs: build-upstream
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric
            project: ':ModernUI-Fabric'
            dir: fabric
          - name: Forge
            project: ':ModernUI-Forge'
            dir: forge
          - name: NeoForge
            project: ':ModernUI-NeoForge'
            dir: neoforge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (compiler)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21 (Gradle runtime)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore ModernUI-Code libs
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: modernui-code-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Copy ModernUI-Code libs into libs/
        shell: bash
        run: |
          mkdir -p libs
          cp dist/*.jar libs/

      - name: Point JavaCompile at the JDK 25 javac
        shell: bash
        # Only the compile tasks are switched over; the declared toolchain stays
        # at 21 so plugins (Loom/minivan) keep seeing it. build.gradle's
        # options.release.set(21) is untouched and keeps the output on Java 21.
        run: |
          cat > "$RUNNER_TEMP/jdk25-compiler.init.gradle" <<'EOF'
          allprojects { proj ->
              proj.plugins.withId('java') {
                  proj.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { t ->
                      t.javaCompiler = proj.javaToolchains.compilerFor {
                          languageVersion = JavaLanguageVersion.of(25)
                      }
                  }
              }
          }
          EOF
          echo "--- init script ---"
          cat "$RUNNER_TEMP/jdk25-compiler.init.gradle"

      - name: Show Java version
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Gradle runs on:   $(java -version 2>&1 | head -1)"
          echo "Compiler JDK 21:  ${{ steps.jdk21.outputs.path }}"
          echo "Compiler JDK 25:  ${{ steps.jdk25.outputs.path }}"

      - name: Read versions
        id: ver
        shell: bash
        run: |
          mc=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          mod=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          echo "minecraft=$mc" >> "$GITHUB_OUTPUT"
          echo "mod=$mod" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} jar
        shell: bash
        # gradlew may not carry the executable bit on Windows-created repos, so run it via sh
        # org.gradle.* are Gradle properties, so they use -D (not -P).
        # Both JDKs are handed to toolchain lookup: 21 satisfies the declared
        # toolchain, 25 satisfies the compiler override from the init script.
        run: >
          sh ./gradlew "${{ matrix.project }}:remapJar" --stacktrace
          -I "$RUNNER_TEMP/jdk25-compiler.init.gradle"
          -Dorg.gradle.java.installations.paths="${{ steps.jdk21.outputs.path }},${{ steps.jdk25.outputs.path }}"
          -Dorg.gradle.java.installations.auto-detect=false
          -Dorg.gradle.java.installations.auto-download=false

      - name: List output
        shell: bash
        run: ls -l "${{ matrix.dir }}/build/libs"

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernUI-${{ steps.ver.outputs.minecraft }}-${{ steps.ver.outputs.mod }}-${{ matrix.name }}
          path: ${{ matrix.dir }}/build/libs/*-universal.jar
          if-no-files-found: error