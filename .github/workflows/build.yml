name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge
            project: ':ModernUI-Forge'
            dir: forge
          - name: NeoForge
            project: ':ModernUI-NeoForge'
            dir: neoforge
          - name: Fabric
            project: ':ModernUI-Fabric'
            dir: fabric

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21.0.7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Pin the exact patch release: newer 21.0.x updates changed javac's
          # handling of RuntimeInvisibleParameterAnnotations and break reading
          # our dependency jars (JDK-8334870 / JDK-8359336).
          java-version: '21.0.7'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read versions
        id: ver
        shell: bash
        run: |
          mc=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          mod=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          echo "minecraft=$mc" >> "$GITHUB_OUTPUT"
          echo "mod=$mod" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} jar
        shell: bash
        # gradlew may not carry the executable bit on Windows-created repos, so run it via sh
        run: sh ./gradlew "${{ matrix.project }}:remapJar" --stacktrace

      - name: List output
        shell: bash
        run: ls -l "${{ matrix.dir }}/build/libs"

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernUI-${{ steps.ver.outputs.minecraft }}-${{ steps.ver.outputs.mod }}-${{ matrix.name }}
          path: ${{ matrix.dir }}/build/libs/*-universal.jar
          if-no-files-found: error
