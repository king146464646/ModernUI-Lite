name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge
            project: ':ModernUI-Forge'
            dir: forge
          - name: NeoForge
            project: ':ModernUI-NeoForge'
            dir: neoforge
          - name: Fabric
            project: ':ModernUI-Fabric'
            dir: fabric

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21.0.7
        id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21.0.8 introduced a javac ClassReader regression (JDK-8341779 /
          # JDK-8359336) that makes javac report "bad class file ... bad
          # RuntimeInvisibleParameterAnnotations attribute" on perfectly valid
          # class files. Pin the last known-good patch release.
          java-version: '21.0.7'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Java version
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          "$JAVA_HOME/bin/javac" -version
          echo "--- Gradle toolchains (same flags as the build) ---"
          sh ./gradlew -q javaToolchains --console=plain \
            -Dorg.gradle.java.installations.paths="${{ steps.jdk.outputs.path }}" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false || true

      - name: Read versions
        id: ver
        shell: bash
        run: |
          mc=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          mod=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')
          echo "minecraft=$mc" >> "$GITHUB_OUTPUT"
          echo "mod=$mod" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} jar
        shell: bash
        # gradlew may not carry the executable bit on Windows-created repos, so run it via sh
        # Force the Gradle toolchain to use exactly the JDK installed above. The runner
        # ships several preinstalled 21.0.x builds and toolchain auto-detection would
        # otherwise pick the newest one, which carries the javac ClassReader regression
        # (JDK-8341779 / JDK-8359336) that breaks class file reading.
        # NOTE: org.gradle.* are Gradle properties, so they use -D (not -P).
        run: >
          sh ./gradlew "${{ matrix.project }}:remapJar" --stacktrace
          -Dorg.gradle.java.installations.paths="${{ steps.jdk.outputs.path }}"
          -Dorg.gradle.java.installations.auto-detect=false
          -Dorg.gradle.java.installations.auto-download=false

      - name: List output
        shell: bash
        run: ls -l "${{ matrix.dir }}/build/libs"

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernUI-${{ steps.ver.outputs.minecraft }}-${{ steps.ver.outputs.mod }}-${{ matrix.name }}
          path: ${{ matrix.dir }}/build/libs/*-universal.jar
          if-no-files-found: error
