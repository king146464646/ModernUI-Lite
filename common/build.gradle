plugins {
    id 'agency.highlysuspect.minivan' version '0.5'
}

repositories {
    maven {
        url 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        url 'https://maven.izzel.io/releases/'
    }
    mavenLocal()
    flatDir { dir rootProject.file('libs') }
}

minivan {
    version(minecraft_version)
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'org.ow2.asm:asm-tree:9.5'

    // ModernUI-Code jars built by build.yml, placed at <repo root>/libs
    implementation fileTree(dir: rootProject.file('libs'), include: ['*.jar'])
    implementation("icyllis.modernui:ModernUI-Markflow:3.12.0") {
        transitive = false
    }
}